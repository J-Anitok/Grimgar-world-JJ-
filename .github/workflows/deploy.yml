name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Find build output directory
        id: find_output
        run: |
          echo "Searching for common output directories..."
          if [ -d "dist" ]; then
            echo "Found dist"
            echo "path=dist" >> $GITHUB_OUTPUT
          elif [ -d "build" ]; then
            echo "Found build"
            echo "path=build" >> $GITHUB_OUTPUT
          elif [ -d "out" ]; then
            echo "Found out"
            echo "path=out" >> $GITHUB_OUTPUT
          elif [ -d "public" ]; then
            echo "Found public"
            echo "path=public" >> $GITHUB_OUTPUT
          else
            echo "No common output directory found; listing repo root for debugging:"
            ls -la
            # default to dist so upload step fails visibly (and logs show listing)
            echo "path=dist" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_output.outputs.path }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
